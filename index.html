<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Hitster iPad</title>
  <meta name="theme-color" content="#0d0f14" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hitster Buzzer" />
  <link rel="manifest" href="./manifest.webmanifest?v=38" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css?v=38" />
</head>
<body>
  <main id="app">
    <section id="setup" class="screen setup-screen">
      <div class="setup-card">
        <h1 class="setup-title">Hitster Buzzer</h1>
        <div class="player-count-label">Aantal spelers</div>
        <div class="segmented" id="playerCount">
          <button data-count="2">2</button>
          <button data-count="3">3</button>
          <button data-count="4" class="active">4</button>
        </div>
        <div id="nameFields" class="name-fields"></div>
        <button id="setupSettingsBtn" class="secondary big setup-settings-btn">Instellingen</button>
        <button id="startGame" class="primary big start-game-green">Start spel</button>
      </div>
      <div class="setup-version">V38 PWA</div>
</section>

    <section id="game" class="screen game-screen hidden">
      <header class="topbar"></header>

      <div id="board" class="board players-4">
        <button class="player-zone p1" data-player="0"></button>
        <button class="player-zone p2" data-player="1"></button>
        <button class="player-zone p3" data-player="2"></button>
        <button class="player-zone p4" data-player="3"></button>

        <div id="centerPanel" class="center-panel">
          <div id="statusText" class="status-text">Klaar</div>
          <div id="winnerView" class="winner-view hidden"></div>
          <div id="questionView" class="question-wrap hidden">
            <div id="winnerMini" class="winner-mini"></div>
            <div id="questionBox" class="question-box">
              <div id="questionText" class="question-text"></div>
              <div id="timerText" class="timer-text"></div>
            </div>
            <button id="nextRound" class="primary next-round">Volgende ronde</button>
          </div>
          <button id="manualStart" class="primary center-start hidden">Start ronde</button>
        </div>
      </div>

      <div id="timeoutSequence" class="timeout-sequence hidden" aria-hidden="true">
        <div id="timeUpText" class="time-up-text hidden">TIJD IS OP!</div>
      </div>

      <button id="settingsGear" class="settings-gear hidden" aria-label="Instellingen" title="Instellingen">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M487.4 315.7l-42.6-24.6c2-11.3 3.2-23 3.2-35.1s-1.2-23.8-3.2-35.1l42.6-24.6c11.8-6.8 15.8-21.9 9-33.7l-32-55.4c-6.8-11.8-21.9-15.8-33.7-9l-42.6 24.6c-17.8-15-38-26.8-60.1-34.7V39.2c0-13.6-11-24.6-24.6-24.6h-64c-13.6 0-24.6 11-24.6 24.6v49.1c-22.1 7.9-42.3 19.7-60.1 34.7L112 98.4c-11.8-6.8-26.9-2.8-33.7 9l-32 55.4c-6.8 11.8-2.8 26.9 9 33.7l42.6 24.6c-2 11.3-3.2 23-3.2 35.1s1.2 23.8 3.2 35.1l-42.6 24.6c-11.8 6.8-15.8 21.9-9 33.7l32 55.4c6.8 11.8 21.9 15.8 33.7 9l42.6-24.6c17.8 15 38 26.8 60.1 34.7v49.1c0 13.6 11 24.6 24.6 24.6h64c13.6 0 24.6-11 24.6-24.6v-49.1c22.1-7.9 42.3-19.7 60.1-34.7l42.6 24.6c11.8 6.8 26.9 2.8 33.7-9l32-55.4c6.9-11.8 2.9-26.9-8.9-33.7zM271.5 336c-44.2 0-80-35.8-80-80s35.8-80 80-80 80 35.8 80 80-35.8 80-80 80z"></path>
        </svg>
      </button>
</section>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h2>Instellingen</h2><button class="close" data-close="settingsModal">×</button></div>
      <div class="theme-setting">
        <span>Weergave</span>
        <div class="theme-toggle" role="group" aria-label="Weergave">
          <button type="button" id="darkModeBtn" class="theme-choice active">Dark</button>
          <button type="button" id="lightModeBtn" class="theme-choice">Light</button>
          <button type="button" id="hitsterModeBtn" class="theme-choice hitster-choice">Hitster</button>
        </div>
      </div>

      <h3>Opdrachten</h3>
      <div id="questionOptions" class="question-options"></div>

      <h3>Parameters</h3>
      <label class="field">Opdrachttimer (seconden)<input id="questionSeconds" type="number" min="5" max="300" value="30"></label>
      <label class="question-check timer-check"><input id="showTimer" type="checkbox" checked><span>Timer tonen</span></label>

      <button id="saveSettings" class="save-settings full">Opslaan</button>
      <button id="resetBtn" class="danger full settings-reset">Reset spel</button>

      <div class="app-version" id="appVersion">Versie: v38 PWA</div>
    </div>
  </div>

  <script src="./app.js?v=38"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=38'));
    }
  </script>
</body>
</html>
