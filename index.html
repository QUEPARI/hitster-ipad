<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Hitster iPad</title>
  <meta name="theme-color" content="#0d0f14" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hitster Buzzer" />
  <link rel="manifest" href="./manifest.webmanifest?v=25" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css?v=25" />
</head>
<body>
  <main id="app">
    <section id="setup" class="screen setup-screen">
      <div class="setup-card">
        <h1>Hitster Buzzer</h1>
        <p class="muted">Single‑iPad versie · v25 PWA</p>
        <div class="segmented" id="playerCount">
          <button data-count="2">2 spelers</button>
          <button data-count="3">3 spelers</button>
          <button data-count="4" class="active">4 spelers</button>
        </div>
        <div id="nameFields" class="name-fields"></div>
        <button id="startGame" class="primary big">Start spel</button>
      </div>
</section>

    <section id="game" class="screen game-screen hidden">
      <header class="topbar"></header>

      <div id="board" class="board players-4">
        <button class="player-zone p1" data-player="0"></button>
        <button class="player-zone p2" data-player="1"></button>
        <button class="player-zone p3" data-player="2"></button>
        <button class="player-zone p4" data-player="3"></button>

        <div id="centerPanel" class="center-panel">
          <div id="statusText" class="status-text">Klaar</div>
          <div id="winnerView" class="winner-view hidden"></div>
          <div id="questionView" class="question-wrap hidden">
            <div id="winnerMini" class="winner-mini"></div>
            <div id="questionBox" class="question-box">
              <div id="questionText" class="question-text"></div>
              <div id="timerText" class="timer-text"></div>
            </div>
            <button id="nextRound" class="primary next-round">Volgende ronde</button>
          </div>
          <button id="manualStart" class="primary center-start hidden">Start ronde</button>
        </div>
      </div>
    
      <button id="settingsGear" class="settings-gear hidden" aria-label="Instellingen" title="Instellingen">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M496,293.984c9.031-0.703,16-8.25,16-17.297v-41.375c0-9.063-6.969-16.594-16-17.313l-54.828-4.281 c-3.484-0.266-6.484-2.453-7.828-5.688l-18.031-43.516c-1.344-3.219-0.781-6.906,1.5-9.547l35.75-41.813 c5.875-6.891,5.5-17.141-0.922-23.547l-29.25-29.25c-6.406-6.406-16.672-6.813-23.547-0.922l-41.813,35.75 c-2.641,2.266-6.344,2.844-9.547,1.516l-43.531-18.047c-3.219-1.328-5.422-4.375-5.703-7.828l-4.266-54.813 C293.281,6.969,285.75,0,276.688,0h-41.375c-9.063,0-16.594,6.969-17.297,16.016l-4.281,54.813c-0.266,3.469-2.469,6.5-5.688,7.828 l-43.531,18.047c-3.219,1.328-6.906,0.75-9.563-1.516l-41.797-35.75c-6.875-5.891-17.125-5.484-23.547,0.922l-29.25,29.25 c-6.406,6.406-6.797,16.656-0.922,23.547l35.75,41.813c2.25,2.641,2.844,6.328,1.5,9.547l-18.031,43.516 c-1.313,3.234-4.359,5.422-7.813,5.688L16,218c-9.031,0.719-16,8.25-16,17.313v41.359c0,9.063,6.969,16.609,16,17.313l54.844,4.266 c3.453,0.281,6.5,2.484,7.813,5.703l18.031,43.516c1.344,3.219,0.75,6.922-1.5,9.563l-35.75,41.813 c-5.875,6.875-5.484,17.125,0.922,23.547l29.25,29.25c6.422,6.406,16.672,6.797,23.547,0.906l41.797-35.75 c2.656-2.25,6.344-2.844,9.563-1.5l43.531,18.031c3.219,1.344,5.422,4.359,5.688,7.844l4.281,54.813 c0.703,9.031,8.234,16.016,17.297,16.016h41.375c9.063,0,16.594-6.984,17.297-16.016l4.266-54.813 c0.281-3.484,2.484-6.5,5.703-7.844l43.531-18.031c3.203-1.344,6.922-0.75,9.547,1.5l41.813,35.75 c6.875,5.891,17.141,5.5,23.547-0.906l29.25-29.25c6.422-6.422,6.797-16.672,0.922-23.547l-35.75-41.813 c-2.25-2.641-2.844-6.344-1.5-9.563l18.031-43.516c1.344-3.219,4.344-5.422,7.828-5.703L496,293.984z M256,342.516 c-23.109,0-44.844-9-61.188-25.328c-16.344-16.359-25.344-38.078-25.344-61.203c0-23.109,9-44.844,25.344-61.172 c16.344-16.359,38.078-25.344,61.188-25.344c23.125,0,44.844,8.984,61.188,25.344c16.344,16.328,25.344,38.063,25.344,61.172 c0,23.125-9,44.844-25.344,61.203C300.844,333.516,279.125,342.516,256,342.516z"></path>
        </svg>
      </button>
</section>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h2>Instellingen</h2><button class="close" data-close="settingsModal">×</button></div>
      <div class="theme-setting">
        <span>Weergave</span>
        <div class="theme-toggle" role="group" aria-label="Weergave">
          <button type="button" id="darkModeBtn" class="theme-choice active">Dark</button>
          <button type="button" id="lightModeBtn" class="theme-choice">Light</button>
        </div>
      </div>

      <h3>Opdrachten</h3>
      <div id="questionOptions" class="question-options"></div>

      <h3>Parameters</h3>
      <label class="field">Opdrachttimer (seconden)<input id="questionSeconds" type="number" min="5" max="300" value="30"></label>
      <label class="switch-row"><span>Timer tonen</span><input id="showTimer" type="checkbox" checked><i></i></label>

      <button id="saveSettings" class="save-settings full">Opslaan</button>
      <button id="resetBtn" class="danger full settings-reset">Reset spel</button>

      <div class="app-version" id="appVersion">Versie: v25 PWA</div>
    </div>
  </div>

  <script src="./app.js?v=25"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=25'));
    }
  </script>
</body>
</html>
