<!doctype html>
<html lang="nl" data-theme="hitster">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Hitster Buzzer</title>
  <meta name="theme-color" content="#00161D" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hitster Buzzer" />
  <link rel="manifest" href="./manifest.webmanifest?v=52" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="./styles.css?v=52" />
</head>
<body>
  <main id="app">
    <section id="setup" class="screen setup-screen">
      <div class="setup-card">
        <h1 class="setup-brand" aria-label="Hitster Buzzer">
          <img class="hitster-logo" src="./hitster-logo-v48.png?v=52" alt="Hitster" />
          <span class="buzzer-neon" aria-hidden="true">BUZZER</span>
        </h1>
        <div class="player-count-label">Aantal spelers</div>
        <div class="segmented" id="playerCount">
          <button data-count="2">2</button>
          <button data-count="3">3</button>
          <button data-count="4" class="active">4</button>
        </div>
        <div id="nameFields" class="name-fields"></div>
        <div class="setup-actions">
          <button type="button" id="startGame" class="primary big start-game-green">Start spel</button>
          <button id="setupSettingsBtn" class="setup-gear" type="button" aria-label="Instellingen" title="Instellingen">
            <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M487.4 315.7l-42.6-24.6c2-11.3 3.2-23 3.2-35.1s-1.2-23.8-3.2-35.1l42.6-24.6c11.8-6.8 15.8-21.9 9-33.7l-32-55.4c-6.8-11.8-21.9-15.8-33.7-9l-42.6 24.6c-17.8-15-38-26.8-60.1-34.7V39.2c0-13.6-11-24.6-24.6-24.6h-64c-13.6 0-24.6 11-24.6 24.6v50.1c-22.1 7.9-42.3 19.7-60.1 34.7L112 98.4c-11.8-6.8-26.9-2.8-33.7 9l-32 55.4c-6.8 11.8-2.8 26.9 9 33.7l42.6 24.6c-2 11.3-3.2 23-3.2 35.1s1.2 23.8 3.2 35.1l-42.6 24.6c-11.8 6.8-15.8 21.9-9 33.7l32 55.4c6.8 11.8 21.9 15.8 33.7 9l42.6-24.6c17.8 15 38 26.8 60.1 34.7v50.1c0 13.6 11 24.6 24.6 24.6h64c13.6 0 24.6-11 24.6-24.6v-49.1c22.1-7.9 42.3-19.7 60.1-34.7l42.6 24.6c11.8 6.8 26.9 2.8 33.7-9l32-55.4c6.9-11.8 2.9-26.9-8.9-33.7zM271.5 336c-44.2 0-80-35.8-80-80s35.8-80 80-80 80 35.8 80 80-35.8 80-80 80z"></path>
        </svg>
          </button>
        </div>
        <p id="startError" class="start-error hidden" role="alert"></p>
      </div>
      <div class="setup-version">V52 PWA</div>
</section>

    <section id="game" class="screen game-screen hidden">
      <header class="topbar"></header>

      <div id="board" class="board players-4">
        <button class="player-zone p1" data-player="0"></button>
        <button class="player-zone p2" data-player="1"></button>
        <button class="player-zone p3" data-player="2"></button>
        <button class="player-zone p4" data-player="3"></button>

        <div id="centerPanel" class="center-panel">
          <div id="statusText" class="status-text">Klaar</div>
          <div id="winnerView" class="winner-view hidden"></div>
          <div id="questionView" class="question-wrap hidden">
            <div id="winnerMini" class="winner-mini"></div>
            <div id="questionBox" class="question-box">
              <div id="questionText" class="question-text"></div>
              <div id="timerText" class="timer-text"></div>
            </div>
            <button id="nextRound" class="primary next-round">Volgende ronde</button>
          </div>
          <button id="manualStart" class="primary center-start hidden">Start ronde</button>
        </div>
      </div>

      <div id="timeoutSequence" class="timeout-sequence hidden" aria-hidden="true">
        <div id="timeUpText" class="time-up-text hidden">TIJD IS OM!</div>
      </div>

      <button id="settingsGear" class="settings-gear hidden" aria-label="Instellingen" title="Instellingen">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M487.4 315.7l-42.6-24.6c2-11.3 3.2-23 3.2-35.1s-1.2-23.8-3.2-35.1l42.6-24.6c11.8-6.8 15.8-21.9 9-33.7l-32-55.4c-6.8-11.8-21.9-15.8-33.7-9l-42.6 24.6c-17.8-15-38-26.8-60.1-34.7V39.2c0-13.6-11-24.6-24.6-24.6h-64c-13.6 0-24.6 11-24.6 24.6v50.1c-22.1 7.9-42.3 19.7-60.1 34.7L112 98.4c-11.8-6.8-26.9-2.8-33.7 9l-32 55.4c-6.8 11.8-2.8 26.9 9 33.7l42.6 24.6c-2 11.3-3.2 23-3.2 35.1s1.2 23.8 3.2 35.1l-42.6 24.6c-11.8 6.8-15.8 21.9-9 33.7l32 55.4c6.8 11.8 21.9 15.8 33.7 9l42.6-24.6c17.8 15 38 26.8 60.1 34.7v50.1c0 13.6 11 24.6 24.6 24.6h64c13.6 0 24.6-11 24.6-24.6v-49.1c22.1-7.9 42.3-19.7 60.1-34.7l42.6 24.6c11.8 6.8 26.9 2.8 33.7-9l32-55.4c6.9-11.8 2.9-26.9-8.9-33.7zM271.5 336c-44.2 0-80-35.8-80-80s35.8-80 80-80 80 35.8 80 80-35.8 80-80 80z"></path>
        </svg>
      </button>
</section>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h2>Instellingen</h2><button class="close" data-close="settingsModal">×</button></div>

      <h3>Opdrachten</h3>
      <div id="questionOptions" class="question-options"></div>

      <h3>Parameters</h3>
      <label class="field">Opdrachttimer (seconden)<input id="questionSeconds" type="number" min="5" max="300" value="30"></label>
      <label class="question-check timer-check"><input id="showTimer" type="checkbox" checked><span>Timer tonen</span></label>

      <button id="saveSettings" class="save-settings full">Opslaan</button>
      <button id="resetBtn" class="danger full settings-reset">Reset spel</button>

      <div class="app-version" id="appVersion">Versie: v52 PWA</div>
    </div>
  </div>

  <script>
    /* v50: foutdiagnose als app.js niet kan laden of uitvoeren. */
    window.__hitsterReady = false;
    window.__hitsterStartClicked = false;
    document.addEventListener('click', function(event) {
      var target = event.target;
      while (target && target !== document && target.id !== 'startGame') target = target.parentNode;
      if (target && target.id === 'startGame') {
        window.setTimeout(function() {
          var setup = document.getElementById('setup');
          if (setup && !setup.classList.contains('hidden')) {
            if (!window.__hitsterReady) hitsterReportError('De startknop is aangeraakt, maar JavaScript is niet klaar.');
            else if (!window.__hitsterStartClicked) hitsterReportError('De startknop reageert, maar de spelhandler wordt niet bereikt.');
          }
        }, 350);
      }
    }, true);
    function hitsterReportError(message) {
      var element = document.getElementById('startError');
      if (!element) return;
      element.textContent = 'Android-diagnose: ' + message;
      element.classList.remove('hidden');
    }
    window.addEventListener('error', function(event) {
      if (!window.__hitsterReady) {
        hitsterReportError((event && event.message && event.message !== 'Script error.') ? event.message : 'JavaScript is niet geladen of geblokkeerd.');
      }
    });
    window.addEventListener('load', function() {
      window.setTimeout(function() {
        if (!window.__hitsterReady) hitsterReportError('De spelcode kon niet starten. Probeer Chrome bij te werken of stuur deze melding door.');
      }, 1200);
    });
  </script>
  <script src="./app.js?v=52"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=52'));
    }
  </script>
</body>
</html>
